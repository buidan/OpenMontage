  language_names: {zh: 中国語, en: 英語, ja: 日本語, vi: ベトナム語}
  stickers:
    challenge: "解けるかな？"
    run: "スタート！"
    tada: "できた！"
    experiment: "実験タイム！"
    speed: "{rate}倍速"
